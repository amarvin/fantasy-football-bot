name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pulp-version: ["<4.0.0", ">=4.0.0"]
        exclude:
          - python-version: "3.10"
            pulp-version: ">=4.0.0"
          - python-version: "3.11"
            pulp-version: ">=4.0.0"

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install pre-commit dependencies
      run: uv --no-build sync --only-group dev
    - name: Run pre-commit
      run: uv --no-build run prek run --show-diff-on-failure --color=always --all-files
    - name: Install pytest dependencies
      run: uv --no-build sync --group test
    - name: Install pulp version
      run: uv pip install "pulp${{ matrix.pulp-version }}"
    - name: Test with pytest
      run: |
        uv run --no-sync pytest --cov=ffbot --cov-report=xml
    - name: "Upload coverage to Codecov"
      uses: codecov/codecov-action@v2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
