name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pulp-version: ["<4.0.0", ">=4.0.0"]
        exclude:
          - python-version: "3.10"
            pulp-version: ">=4.0.0"
          - python-version: "3.11"
            pulp-version: ">=4.0.0"

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Install pre-commit dependencies
      run: uv sync --only-group dev
    - name: Run pre-commit
      run: uv run prek run --show-diff-on-failure --color=always --all-files
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run --no-sync flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run --no-sync flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Install pytest dependencies
      run: uv sync --group test
    - name: Install pulp version
      run: uv pip install "pulp${{ matrix.pulp-version }}"
    - name: Test with pytest
      run: |
        uv run --no-sync pytest --cov=ffbot --cov-report=xml
    - name: "Upload coverage to Codecov"
      uses: codecov/codecov-action@v2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
