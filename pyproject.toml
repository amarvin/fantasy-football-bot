[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffbot"
version = "1.2.13"
description = "Automate playing Yahoo Fantasy Football"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alex Marvin", email = "alex.marvin@gmail.com" }]
keywords = ["fantasy-football", "bot", "yahoo"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4",
    "loguru",
    "lxml",
    "pandas",
    "pulp[cbc]",
    "requests",
    "tqdm",
    "user_agent",
]

[project.optional-dependencies]
ui = [
    "dash~=4.5.0",
    "dash-bootstrap-components~=2.0.4",
]

[project.urls]
Homepage = "https://github.com/amarvin/fantasy-football-bot"

[tool.setuptools.packages.find]
exclude = ["contrib", "data", "dist", "docs", "tests"]

[dependency-groups]
dev = [
    "prek",
]
test = [
    "pandas[html]",
    "pytest",
    "pytest-cov",
]

[tool.black]
enable-unstable-feature = ['string_processing']
line-length = 88
preview = true

[tool.codespell]
count = true
ignore-words-list = "TE,VOR,vor"
skip = ".venv,data/*"

[tool.isort]
color_output = true
known_local_folder = ["app", "components"]
line_length = 88
profile = "black"
